[pytest]
# Where pytest looks for tests.
testpaths = tests

# Put the project root on sys.path so tests can `import config`, `from agents.nodes import ...`
# without any sys.path hacks. (pytest 7+ feature.)
pythonpath = .

# Naming conventions pytest uses to auto-discover tests.
python_files = test_*.py
python_functions = test_*

# Default flags applied to every run:
#   -v            verbose (show each test name)
#   -ra           show a short summary of all non-passing outcomes at the end
addopts = -v -ra
